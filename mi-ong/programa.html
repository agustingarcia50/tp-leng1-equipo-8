<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Adopción de Mascotas</title>
</head>
<body>

    <h1>Formulario de Adopción</h1>

    <form>
        <label for="nombre">Nombre completo:</label><br>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="email">Correo electrónico:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="telefono">Teléfono:</label><br>
        <input type="tel" id="telefono" name="telefono"><br><br>

        <label for="tipoMascota">¿Qué tipo de mascota querés adoptar?</label><br>
        <select id="tipoMascota" name="tipoMascota">
            <option value="perro">Perro</option>
            <option value="gato">Gato</option>
            <option value="otro">Otro</option>
        </select><br><br>

        <label for="mensaje">Contanos por qué querés adoptar:</label><br>
        <textarea id="mensaje" name="mensaje" rows="4"></textarea><br><br>

        <button type="submit">Enviar solicitud</button>
    </form>

    <hr>

    <h1>Dar un animal en adopción</h1>

    <form>
        <label for="nombreDueño">Tu nombre:</label><br>
        <input type="text" id="nombreDueño" name="nombreDueño" required><br><br>

        <label for="contacto">Contacto (email o teléfono):</label><br>
        <input type="text" id="contacto" name="contacto" required><br><br>

        <label for="nombreMascota">Nombre del animal:</label><br>
        <input type="text" id="nombreMascota" name="nombreMascota"><br><br>

        <label for="edad">Edad aproximada:</label><br>
        <input type="number" id="edad" name="edad"><br><br>

        <label for="tipo">Tipo de animal:</label><br>
        <select id="tipo" name="tipo">
            <option value="perro">Perro</option>
            <option value="gato">Gato</option>
            <option value="otro">Otro</option>
        </select><br><br>

        <label for="descripcion">Descripción:</label><br>
        <textarea id="descripcion" name="descripcion" rows="4"></textarea><br><br>

        <button type="submit">Publicar</button>
    </form>

</body>
</html>
