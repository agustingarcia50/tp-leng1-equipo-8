<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Patitas Felices</title>
</head>
<body>
     <header> 
    <img src="" alt="Logo de Patitas Felices">
     <h1>Patitas Felices</h1>
        <h2>Refugio de adopcion para perritos necesitados</h2>
        <nav>
            <ul>
                <li><a href= "./index.html">Index</a></li>
                <li><a href= "./adopcion.html">Adopcion</a></li>
                <li><a href= "./contacto.html">Contacto</a></li>
            </ul>
    </nav>
   </header> 
   <main>
    <h2>Contacto</h2>
    <p>Para consultas, rescates, voluntariado o donaciones. Completá el formulario o escribinos a <a href="mailto:info@patitasfelices.ong">info@patitasfelices.ong</a></p>
    <form action="#" method="post">
        <br>
        <label for="nombre">Nombre y Apellido</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej: Nahir Alvarez" required>
        <br>
        <label for="email">Correo Electronico</label>
        <input type="email" id="email" name="email" placeholder="tucorreo@mail.com" required>
        <br>
        <label for="telefono">Telefono</label>
        <input type="tel" id="telefono" name="telefono" placeholder="+54 9 123456789" required>
        <br>
        <label for="programa">Motivo de contacto</label>
         <select name="programa" id="programa" required>
         <option value="elegir programa">Elegir motivo</option>  
         <option value="voluntariado">Voluntariado</option>
         <option value="rescate">Rescate de animales</option>
         <option value="donaciones">Donaciones</option> 
         <option value="otros">Otros</option>
        </select>
        <br>
        <label for="disponibilidad">Disponibilidad</label>
        <select name="disponibilidad" id="disponibilidad" required>
        <option value="Horario de contacto">Horario de contacto preferido</option>
        <option value="Mañana">Mañana</option>
        <option value="Tarde">Tarde</option>
        <option value="Noche">Noche</option>
        </select>
        <br>
        <label for="mensaje">Contanos más detalles</label>
        <textarea name="mensaje" id="mensaje" rows="4" cols="50" placeholder="Escribe tu mensaje aquí..." required></textarea>
        <br>
        <button type="submit">Enviar</button>
    </form>
    </main>
   <footer>
    <p> <small>Patitas Felices &copy; 2026</small></p>
   </footer>
</body>
</html>
